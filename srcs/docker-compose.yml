services:
  nginx:
    container_name: nginx
    build: requirements/nginx
    image: nginx:98
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    networks:
      - inception-network
    ports:
      - 443:443
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/www/wordpress
    restart: on-failure
  mariadb:
    container_name: mariadb
    build: requirements/mariadb
    image: mariadb:98
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception-network
    volumes:
      - db:/var/lib/mysql
    restart: on-failure
  wordpress:
    container_name: wordpress
    build: requirements/wordpress
    image: wordpress:98
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - db_password
      - credentials
      - credentials_2
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/wordpress
    restart: on-failure

networks:
  inception-network:
    driver: bridge

volumes:
  db:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/${LOGIN}/data/mariadb'

  wordpress_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/${LOGIN}/data/wordpress'

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_pass.txt
  credentials:
    file: ../secrets/credentials.txt
  credentials_2:
    file: ../secrets/credentials_2.txt
    