services:
  nginx:
    build: ./nginx
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    networks:
      - inception-network
    ports:
      - 443:443
    depends_on:
      - wordpress
    restart: on-failure
  mariadb:
    build: ./mariadb
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception-network
    volumes:
      - db:/var/lib/mysql
    restart: on-failure
  wordpress:
    build: ./wordpress
    environment:
      DOMAIN_NAME: ${DOAMIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - db_password
      - credentials
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    restart: on-failure
networks:
  inception-network:
    driver: bridge

volumes:
  db:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/workspaces/inception2/srcs/mariadb'

  wordpress_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/workspaces/inception2/srcs/wordpress'

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_pass.txt
  credentials:
    file: ../secrets/credentials.txt



